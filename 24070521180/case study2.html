<!DOCTYPE html>
<html>
<head>
  <title>Billing Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff; /* White background */
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #ff0000; /* Red color */
      margin: 20px 0;
      text-align: center;
    }
    .container {
      background-color: #fff;
      padding: 20px;
      border: 2px solid #ff0000; /* Red border */
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: #ff4d4d; /* Light red */
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      color: white;
    }
    button:hover {
      background-color: #e60000; /* Darker red on hover */
    }
    #bill {
      margin-top: 20px;
      background-color: #ffe5e5; /* Light pinkish white for bill display */
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ff0000;
      width: 100%;
    }
    #bill h2 {
      margin-top: 0;
      color: #cc0000;
    }
    #total {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Pratyaam (24070521180)</h1>
<div class="container">
  <label for="item">Item Name:</label>
  <input type="text" id="item" placeholder="Enter item name">

  <label for="price">Price (per item):</label>
  <input type="number" id="price" placeholder="Enter price" min="0" step="0.01">

  <label for="quantity">Quantity:</label>
  <input type="number" id="quantity" placeholder="Enter quantity" min="1" step="1">

  <button onclick="generateBill()">Generate Bill</button>

  <div id="bill" style="display:none;">
    <h2>Bill Details</h2>
    <div id="billDetails"></div>
    <div id="total"></div>
  </div>
</div>

<script>
function generateBill() {
  const itemName = document.getElementById('item').value.trim();
  const price = parseFloat(document.getElementById('price').value);
  const quantity = parseInt(document.getElementById('quantity').value);

  if (itemName === "" || isNaN(price) || isNaN(quantity) || price < 0 || quantity < 1) {
    alert("Please enter valid item details.");
    return;
  }

  const gstRate = 0.18; // 18% GST
  const amount = price * quantity;
  const gstAmount = amount * gstRate;
  const totalAmount = amount + gstAmount;

  const billDetailsDiv = document.getElementById('billDetails');
  billDetailsDiv.innerHTML = `
    <p><strong>Item:</strong> ${itemName}</p>
    <p><strong>Price per item:</strong> ₹${price.toFixed(2)}</p>
    <p><strong>Quantity:</strong> ${quantity}</p>
    <p><strong>Subtotal:</strong> ₹${amount.toFixed(2)}</p>
    <p><strong>GST (18%):</strong> ₹${gstAmount.toFixed(2)}</p>
  `;

  document.getElementById('total').innerText = `Total Amount (including GST): ₹${totalAmount.toFixed(2)}`;

  document.getElementById('bill').style.display = 'block';
}
</script>

</body>
</html>
