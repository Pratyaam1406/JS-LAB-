<!DOCTYPE html>
<html>
<head>
  <title>ATM PIN Palindrome Check</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f7fa; /* Pastel cyan */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      color: #00796b; /* Pastel teal */
      text-align: center;
    }
    .container {
      background-color: #ffe0b2; /* Pastel orange */
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 300px;
      width: 100%;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: #aed581; /* Pastel green */
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #9ccc65; /* Slightly darker green on hover */
    }
    #message {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Pratyaam (24070521180)</h1>
<div class="container">
  <label for="pin">Enter PIN:</label>
  <input type="text" id="pin" maxlength="10" placeholder="Enter your PIN">
  <button onclick="checkPIN()">Verify PIN</button>
  <div id="message"></div>
</div>

<script>
function checkPIN() {
  const pin = document.getElementById('pin').value.trim();
  const messageDiv = document.getElementById('message');

  if (pin === "") {
    messageDiv.innerText = "Please enter your PIN.";
    messageDiv.style.color = "black";
    return;
  }

  const reversedPin = pin.split('').reverse().join('');
  if (pin === reversedPin) {
    messageDiv.innerText = "Security Alert: Your PIN is a palindrome! Be cautious.";
    messageDiv.style.color = "green";
  } else {
    messageDiv.innerText = "Your PIN is not a palindrome.";
    messageDiv.style.color = "blue";
  }
}
</script>

</body>
</html>
