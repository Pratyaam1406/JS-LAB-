<!DOCTYPE html>
<html lang="en">
    <header class="student-header">
    <div>
        <h2>Pratyaam Sinha</h2>
        <p>24070521180</p>
    </div>

    <div class="logo">
        Cart<span>Flow</span>
    </div>

    <div class="cart-icon">
        🛒 <span id="cartCount">4</span> Items
    </div>
</header>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartFlow - Smart Cart Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #111827, #1e1b4b);
            color: white;
            padding: 30px;
        }

        header {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #a78bfa;
        }

        .logo span {
            color: #22d3ee;
        }

        .cart-icon {
            background: rgba(255,255,255,0.08);
            padding: 12px 18px;
            border-radius: 30px;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .product {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.09);
        }

        .product-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .product-image {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
        }

        .product h3 {
            margin-bottom: 5px;
        }

        .price {
            color: #22d3ee;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #334155;
            color: white;
            font-size: 18px;
        }

        .qty-btn:hover {
            background: #6366f1;
        }

        .summary h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
            color: #cbd5e1;
        }

        .discount {
            color: #4ade80;
        }

        .total {
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 20px;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .checkout {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(90deg, #6366f1, #06b6d4);
            transition: 0.3s;
        }

        .checkout:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(6,182,212,0.3);
        }

        .discount-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 14px;
            background: rgba(74,222,128,0.08);
            color: #86efac;
            font-size: 14px;
        }

        @media(max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }

            header {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Cart<span>Flow</span></div>
    <div class="cart-icon">🛒 <span id="cartCount">4</span> Items</div>
</header>

<div class="container">

    <!-- CART -->
    <div class="card">
        <h1>Your Cart</h1>
        <p class="subtitle">Review your items before checkout</p>

        <div id="cartItems"></div>
    </div>

    <!-- SUMMARY -->
    <div class="card summary">
        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">₹0</span>
        </div>

        <div class="summary-row discount">
            <span>Discount</span>
            <span id="discount">- ₹0</span>
        </div>

        <div class="summary-row">
            <span>Delivery</span>
            <span>FREE</span>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span id="total">₹0</span>
        </div>

        <div class="discount-box" id="discountMessage">
            🎁 Add more items to unlock discounts!
        </div>

        <button class="checkout" onclick="checkout()">
            Proceed to Checkout →
        </button>
    </div>

</div>


<script>
    .student-header {
    max-width: 1100px;
    margin: 0 auto 40px;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;

    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    border-radius: 18px;

    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

.student-header h2 {
    font-size: 20px;
    color: #ffffff;
}

.student-header p {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 3px;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    color: #a78bfa;
}

.logo span {
    color: #22d3ee;
}

.cart-icon {
    background: rgba(255,255,255,0.08);
    padding: 12px 18px;
    border-radius: 30px;
    font-size: 15px;
}

    // Product objects
    const cart = [
        {
            name: "Laptop",
            price: 50000,
            quantity: 1,
            icon: "💻"
        },
        {
            name: "Wireless Mouse",
            price: 1000,
            quantity: 2,
            icon: "🖱️"
        },
        {
            name: "Keyboard",
            price: 2000,
            quantity: 1,
            icon: "⌨️"
        }
    ];

    // Display cart using map()
    function displayCart() {

        const cartContainer = document.getElementById("cartItems");

        cartContainer.innerHTML = cart.map((item, index) => `
            <div class="product">

                <div class="product-info">

                    <div class="product-image">
                        ${item.icon}
                    </div>

                    <div>
                        <h3>${item.name}</h3>
                        <div class="price">
                            ₹${item.price.toLocaleString()}
                        </div>
                    </div>

                </div>

                <div class="quantity">

                    <button class="qty-btn"
                        onclick="changeQuantity(${index}, -1)">
                        −
                    </button>

                    <span>${item.quantity}</span>

                    <button class="qty-btn"
                        onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                </div>

            </div>
        `).join("");

        calculateTotal();
    }


    // Change quantity
    function changeQuantity(index, change) {

        cart[index].quantity += change;

        if (cart[index].quantity < 1) {
            cart[index].quantity = 1;
        }

        displayCart();
    }


    // Calculate total using reduce()
    function calculateTotal() {

        const subtotal = cart.reduce((total, item) => {
            return total + item.price * item.quantity;
        }, 0);

        let discount = 0;
        let message = "";

        // Discount logic
        if (subtotal >= 50000) {

            discount = subtotal * 0.10;
            message = "🔥 10% discount applied!";

        } else if (subtotal >= 20000) {

            discount = subtotal * 0.05;
            message = "✨ 5% discount applied!";

        } else {

            message = "🎁 Spend ₹20,000 to unlock 5% discount!";
        }

        const total = subtotal - discount;

        document.getElementById("subtotal").textContent =
            "₹" + subtotal.toLocaleString();

        document.getElementById("discount").textContent =
            "- ₹" + discount.toLocaleString();

        document.getElementById("total").textContent =
            "₹" + total.toLocaleString();

        document.getElementById("discountMessage").textContent =
            message;

        // Calculate total cart quantity
        const itemCount = cart.reduce(
            (count, item) => count + item.quantity,
            0
        );

        document.getElementById("cartCount").textContent = itemCount;
    }


    function checkout() {
        alert("🎉 Order ready for checkout!");
    }


    // Initial display
    displayCart();

</script>

</body>
</html>
